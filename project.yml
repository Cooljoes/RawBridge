name: RawBridge
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configFiles:
  Debug: Config/Debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  RawBridge:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - Models
      - Views
      - ViewModels
      - Services
      - Utilities
      - path: Resources
        excludes: [Icon.svg]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cooljoes.RawBridge
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RawBridge
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Read the original photo resources you select for extraction.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  RawBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RawBridgeTests]
    dependencies:
      - target: RawBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cooljoes.RawBridgeTests
        GENERATE_INFOPLIST_FILE: YES
  RawBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RawBridgeUITests]
    dependencies:
      - target: RawBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cooljoes.RawBridgeUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RawBridge:
    build:
      targets:
        RawBridge: all
    test:
      targets: [RawBridgeTests, RawBridgeUITests]
